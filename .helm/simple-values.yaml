fullnameOverride: "$CI_PROJECT_NAME_SLUG"

global:
  image:
    repository: docker.repo.severstal.severstalgroup.com/$CI_PROJECT_PATH
    tag: dev

secrets:
  enabled: true
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
  projectNamespace: "$CI_PROJECT_NAMESPACE"
  backend: "eso-vault-backend"
  files: {}

deployment:
  replicas: 1
  reloadOnChange:
    enabled: true
  env:
  - name: DXF_GUNICORN_WORKERS
    value: "1"
  - name: GUNICORN_TIMEOUT
    value: "120"
  resources:
    limits:
      memory: 1Gi
      cpu: 1
    requests:
      memory: 512Mi
      cpu: 0.2
  tolerations:
  - key: "client-cluster"
    operator: "equal"
    value: "sales-supply"
    effect: "NoSchedule"

service:
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
