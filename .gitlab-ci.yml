include:
  - project: '${SSS_V3_CI_TEMPLATE_PROJECT}'
    file:
      - '/python.yml'

deploy:
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      variables:
        IMAGE_TAG: "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
        DEPLOYMENT_ENVIRONMENT: "dev-2"
        
    - if: $CI_COMMIT_BRANCH =~ /^(test|stage)$/ || $CI_COMMIT_BRANCH =~ /^epic.*$/
      variables:
        IMAGE_TAG: "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
        DEPLOYMENT_ENVIRONMENT: $CI_COMMIT_BRANCH
